[package]
name = "auram-launcher"
version = "0.0.0"
description = "Auram Minecraft launcher"
authors = ["AuramMods"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "auram_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
qa = []
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-updater", "dep:tauri-plugin-process", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
futures-util = "0.3"
hex = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rand = "0.9"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha1 = "0.10"
sha2 = "0.10"
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
url = "2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
ignore = "0.4"
unicode-normalization = "0.1"
same-file = "1"
minisign-verify = "=0.3.0"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
regex = "1"
tauri-plugin-clipboard-manager = { version = "2", optional = true }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
tauri-plugin-dialog = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
ed25519-dalek = "2"
blake2 = "0.10"

[[example]]
name = "verify_pack_delivery"
required-features = ["qa"]

[[example]]
name = "verify_sftp"
required-features = ["qa"]

[[example]]
name = "bench_sftp_small_files"
required-features = ["qa"]

[[example]]
name = "bench_sftp_activation"
required-features = ["qa"]

# Keep pnpm dev's integrity checks representative of packaged performance.
[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

[profile.release]
strip = false

[profile.release.build-override]
strip = false
